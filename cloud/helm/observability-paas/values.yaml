alerting:
    folder: alerts
    interval: 1m
    rules: {}
centralHub:
    argoWorkflowsUrl: ""
    argocdUrl: ""
    dnsZone: ""
    gitUrl: ""
    locationLabel: ""
    projectLabel: ""
dashboards:
    folder: Liferay
    items:
        builds:
            file: dashboards/builds.json
        central-hub:
            file: dashboards/central-hub.json
        custom-domains:
            file: dashboards/custom-domains.json
        secrets:
            file: dashboards/secrets.json
gateway:
    annotations: {}
    enabled: true
    envoy:
        backendTrafficPolicy:
            healthCheck:
                active:
                    healthyThreshold: 1
                    http:
                        path: /api/health
                    interval: 60s
                    type: HTTP
                    unhealthyThreshold: 3
            loadBalancer:
                consistentHash:
                    type: SourceIP
                type: ConsistentHash
            timeout:
                http:
                    requestTimeout: 180s
        clientTrafficPolicy:
            tls:
                ciphers:
                    -   ECDHE-ECDSA-CHACHA20-POLY1305
                    -   ECDHE-RSA-CHACHA20-POLY1305
                    -   ECDHE-ECDSA-AES128-GCM-SHA256
                    -   ECDHE-RSA-AES128-GCM-SHA256
                    -   ECDHE-ECDSA-AES256-GCM-SHA384
                    -   ECDHE-RSA-AES256-GCM-SHA384
                maxVersion: "1.3"
                minVersion: "1.2"
    gatewayClassName: ""
    gke:
        backendPolicy:
            logging:
                enabled: true
                sampleRate: 100000
            sessionAffinity:
                type: CLIENT_IP
            timeoutSec: 180
        gatewayPolicy:
            sslPolicy: restricted
        healthCheck:
            checkIntervalSec: 60
            healthyThreshold: 1
            logConfig:
                enabled: true
            requestPath: /api/health
    name: grafana-gateway
    provider: envoy
gmp:
    collectorRBAC:
        enabled: false
        secretName: my-basic-auth-secret
    customMetricsStackdriverAdapter:
        affinity: {}
        enabled: false
        image:
            pullPolicy: Always
            repository: gcr.io/gke-release/custom-metrics-stackdriver-adapter
            tag: v0.16.8-gke.0
        podDisruptionBudget:
            enabled: true
            maxUnavailable: 1
        resources:
            limits:
                cpu: 250m
                memory: 200Mi
            requests:
                cpu: 250m
                memory: 200Mi
        tolerations: []
jobs:
    deleteUnprovisionedResources:
        annotations: {}
        concurrencyPolicy: Forbid
        enabled: false
        extraEnv:
            -   name: DRY_RUN
                value: "false"
            -   name: IGNORE_CONFIRM
                value: "true"
        image:
            pullPolicy: IfNotPresent
            repository: docker.io/bitnami/kubectl
            tag: 1.35.1@sha256:4c5f63828f5170142d714cdf1f96bad9e223f7ad79bd67d6d6b21e59a188c514
        podAnnotations: {}
        resources:
            limits:
                cpu: 50m
                memory: 128Mi
            requests:
                cpu: 10m
                memory: 16Mi
        restartPolicy: OnFailure
        schedule: 0 23 * * 0
observability:
    alloy:
        iam:
            gcpServiceAccount: ""
        scrape:
            kubeStateMetrics:
                enabled: false
    cloudProvider: gcp
    dashboards:
        items:
            central-hub:
                enabled: false
    gcp:
        projectId: ""
    grafana:
        extraSecretMounts:
            -   defaultMode: 0440
                mountPath: /etc/secrets/grafana_oidc
                name: grafana-oidc
                optional: true
                readOnly: true
                secretName: grafana-oidc
            -   defaultMode: 0440
                mountPath: /etc/secrets/grafana_smtp
                name: grafana-smtp
                optional: true
                readOnly: true
                secretName: grafana-smtp
        grafana.ini:
            auth:
                disable_login_form: false
            auth.okta:
                auto_login: false
                enabled: false
                name: Liferay
                use_refresh_token: true
                validate_id_token: true
            smtp:
                enabled: false
                from_address: workspace@liferay.cloud
                from_name: "[CNE] Grafana Alerting"
                host: smtp.sparkpostmail.com:587
                password: $__file{/etc/secrets/grafana_smtp/password}
                skip_verify: true
                user: $__file{/etc/secrets/grafana_smtp/user}
        networkPolicy:
            allowExternal: false
            enabled: true
            explicitIpBlocks:
                -   35.191.0.0/16
                -   130.211.0.0/22
            ingress: true
        plugins:
            -   googlecloud-logging-datasource
        route:
            main:
                enabled: true
                filters:
                    -   responseHeaderModifier:
                            set:
                                -   name: Strict-Transport-Security
                                    value: max-age=31536000; includeSubDomains; preload
                        type: ResponseHeaderModifier
                hostnames:
                    -   monitoring.example.com
                parentRefs:
                    -   group: gateway.networking.k8s.io
                        kind: Gateway
                        name: grafana-gateway
                        sectionName: https
            redirect:
                enabled: true
                hostnames:
                    -   monitoring.example.com
                httpsRedirect: true
                parentRefs:
                    -   group: gateway.networking.k8s.io
                        kind: Gateway
                        name: grafana-gateway
                        sectionName: http
    kube-state-metrics:
        customResourceState:
            config:
                kind: CustomResourceStateMetrics
                spec:
                    resources:
                        -   groupVersionKind:
                                group: backup.liferay.cloud
                                kind: LiferayBackup
                                version: v1alpha1
                            labelsFromPath:
                                name: [metadata, name]
                                namespace: [metadata, namespace]
                            metrics:
                                -   each:
                                        info:
                                            labelsFromPath:
                                                db_instance_id: [status, databaseSnapshot, instanceId]
                                                doclib_dest_bucket: [status, documentLibrary, destinationBucket]
                                                doclib_source_bucket: [status, documentLibrary, sourceBucket]
                                                snapshot_id: [status, databaseSnapshotId]
                                        type: Info
                                    help: Liferay backup information
                                    name: liferay_backup_info
                                -   each:
                                        gauge:
                                            labelsFromPath:
                                                reason: [reason]
                                                type: [type]
                                            path: [status, conditions]
                                            valueFrom: [status]
                                        type: Gauge
                                    help: Liferay backup condition status (1 = True, 0 = False)
                                    name: liferay_backup_status_condition
                                -   each:
                                        gauge:
                                            path: [status]
                                            valueFrom: [startTime]
                                        type: Gauge
                                    help: Start time of the Liferay backup in Unix seconds
                                    name: liferay_backup_start_time_seconds
                                -   each:
                                        gauge:
                                            path: [status]
                                            valueFrom: [completionTime]
                                        type: Gauge
                                    help: Completion time of the Liferay backup in Unix seconds
                                    name: liferay_backup_completion_time_seconds
                        -   groupVersionKind:
                                group: gateway.networking.k8s.io
                                kind: HTTPRoute
                                version: v1
                            labelsFromPath:
                                name: [metadata, name]
                                namespace: [metadata, namespace]
                            metrics:
                                -   each:
                                        info:
                                            labelsFromPath:
                                                hostname: []
                                            path: [spec, hostnames]
                                        type: Info
                                    help: HTTPRoute hostname info (one metric per hostname in spec.hostnames)
                                    name: httproute_info
                        -   groupVersionKind:
                                group: cert-manager.io
                                kind: Certificate
                                version: v1
                            labelsFromPath:
                                name: [metadata, name]
                                namespace: [metadata, namespace]
                            metrics:
                                -   each:
                                        info:
                                            labelsFromPath:
                                                hostname: []
                                            path: [spec, dnsNames]
                                        type: Info
                                    help: Certificate dnsName info (one metric per spec.dnsNames entry)
                                    name: certificate_dnsname_info
            create: true
            enabled: true
        extraArgs:
            -   >-
                --metric-allowlist=kube_customresource_certificate_dnsname_info,kube_customresource_httproute_info,kube_customresource_liferay_backup_completion_time_seconds,kube_customresource_liferay_backup_info,kube_customresource_liferay_backup_start_time_seconds,kube_customresource_liferay_backup_status_condition,kube_deployment_status_replicas,kube_deployment_status_replicas_ready,kube_deployment_status_replicas_unavailable,kube_namespace_labels,kube_node_info,kube_node_status_condition,kube_pod_container_info,kube_pod_container_resource_limits,kube_pod_container_resource_requests,kube_pod_container_status_last_terminated_reason,kube_pod_container_status_last_terminated_timestamp,kube_pod_container_status_restarts_total,kube_pod_status_phase,kube_pod_status_ready,kube_secret_created,kube_secret_info,kube_secret_labels,kube_secret_metadata_resource_version,kube_secret_owner,kube_statefulset_labels,kube_statefulset_status_replicas,kube_statefulset_status_replicas_ready
            -   --v=1
        metricLabelsAllowlist:
            -   namespaces=[environmentId,liferay.com/observable,projectCustomer]
            -   secrets=[sme-app-destination-namespace,sme-created-at,sme-managed,sme-updated-at,sme-user-create,sme-user-update]
            -   statefulsets=[helm.sh/chart]
        rbac:
            extraRules:
                -   apiGroups: ["apiextensions.k8s.io"]
                    resources: ["customresourcedefinitions"]
                    verbs: ["list", "watch"]
                -   apiGroups: ["backup.liferay.cloud"]
                    resources: ["liferaybackups", "liferaybackups/status"]
                    verbs: ["list", "watch"]
                -   apiGroups: ["gateway.networking.k8s.io"]
                    resources: ["httproutes"]
                    verbs: ["list", "watch"]
                -   apiGroups: ["cert-manager.io"]
                    resources: ["certificates"]
                    verbs: ["list", "watch"]
smtp:
    enabled: false
    externalSecret:
        name: grafana-smtp
        remoteSecretName: lcp_cne_grafana_smtp_json
        secretStoreName: ""
sso:
    enabled: false
    externalSecret:
        name: grafana-oidc
        remoteSecretName: okta_sso_oidc_properties_json
        secretStoreName: ""
