{{- $folder := .Values.dashboards.folder -}}
{{- $datasourceUid := index .Values "observability" "datasource" "uid" | default "managed-prometheus" -}}
{{- $namespace := include "observability-paas.namespace" . -}}
{{- $ch := .Values.centralHub -}}
{{- range $key, $entry := .Values.dashboards.items }}
{{- if not (eq $entry.enabled false) }}
{{- $raw := $.Files.Get $entry.file -}}
{{- if not $raw -}}
{{- fail (printf "Dashboard file %s not found in chart" $entry.file) -}}
{{- end -}}
{{- $rendered := $raw | replace "${DS_PROMETHEUS}" $datasourceUid -}}
{{- if eq $key "builds" -}}
{{- $rendered = $rendered | replace "\"${BUILDS_HTML}\"" ($.Files.Get "dashboards/html/builds.html" | toJson) -}}
{{- end }}
{{- if eq $key "central-hub" -}}
{{- $centralHubCtx := dict "dnsZone" $ch.dnsZone "gitUrl" $ch.gitUrl "location" $ch.locationLabel "projectSlug" $ch.projectLabel -}}
{{- $rendered = $rendered | replace "\"${CENTRAL_HUB_HTML}\"" (tpl ($.Files.Get "dashboards/html/central-hub.html") $centralHubCtx | toJson) -}}
{{- end }}
{{- if eq $key "custom-domains" -}}
{{- $rendered = $rendered | replace "\"${CUSTOM_DOMAINS_HEADER_HTML}\"" ($.Files.Get "dashboards/html/custom-domains-header.html" | toJson) -}}
{{- $rendered = $rendered | replace "\"${CUSTOM_DOMAINS_GUIDE_HTML}\"" ($.Files.Get "dashboards/html/custom-domains-guide.html" | toJson) -}}
{{- end }}
{{- if eq $key "secrets" -}}
{{- $rendered = $rendered | replace "\"${SECRETS_HTML}\"" ($.Files.Get "dashboards/html/secrets.html" | toJson) -}}
{{- end }}
---
apiVersion: v1
data:
    {{ $key }}.json: |
        {{- $rendered | nindent 8 }}
kind: ConfigMap
metadata:
    annotations:
        grafana_folder: {{ $folder | quote }}
    labels:
        {{- include "observability-paas.labels" $ | nindent 8 }}
        grafana_dashboard: "true"
    name: {{ printf "%s-dashboard-%s" (include "observability-paas.fullname" $) $key | trunc 63 | trimSuffix "-" | quote }}
    namespace: {{ $namespace | quote }}
{{- end }}
{{- end }}