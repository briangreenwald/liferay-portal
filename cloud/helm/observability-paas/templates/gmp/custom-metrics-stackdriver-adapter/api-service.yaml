{{- if .Values.gmp.customMetricsStackdriverAdapter.enabled -}}
{{- $name := include "observability-paas.gmp.customMetricsStackdriverAdapter.name" $ -}}
{{- $namespace := include "observability-paas.namespace" $ -}}
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
    labels:
        {{- include "observability-paas.labels" $ | nindent 8 }}
    name: v1beta1.custom.metrics.k8s.io
spec:
    group: custom.metrics.k8s.io
    groupPriorityMinimum: 100
    insecureSkipTLSVerify: true
    service:
        name: {{ $name }}
        namespace: {{ $namespace | quote }}
    version: v1beta1
    versionPriority: 100
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
    labels:
        {{- include "observability-paas.labels" $ | nindent 8 }}
    name: v1beta2.custom.metrics.k8s.io
spec:
    group: custom.metrics.k8s.io
    groupPriorityMinimum: 100
    insecureSkipTLSVerify: true
    service:
        name: {{ $name }}
        namespace: {{ $namespace | quote }}
    version: v1beta2
    versionPriority: 200
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
    labels:
        {{- include "observability-paas.labels" $ | nindent 8 }}
    name: v1beta1.external.metrics.k8s.io
spec:
    group: external.metrics.k8s.io
    groupPriorityMinimum: 100
    insecureSkipTLSVerify: true
    service:
        name: {{ $name }}
        namespace: {{ $namespace | quote }}
    version: v1beta1
    versionPriority: 100
{{- end -}}