{{- if .Values.gmp.customMetricsStackdriverAdapter.enabled -}}
{{- $name := include "observability-paas.gmp.customMetricsStackdriverAdapter.name" $ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
    labels:
        {{- include "observability-paas.labels" $ | nindent 8 }}
    name: {{ $name }}
    namespace: {{ include "observability-paas.namespace" $ | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    labels:
        {{- include "observability-paas.labels" $ | nindent 8 }}
    name: custom-metrics-resource-reader
rules:
    -   apiGroups:
            -   ""
        resources:
            -   pods
            -   nodes
            -   nodes/stats
        verbs:
            -   get
            -   list
            -   watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    labels:
        {{- include "observability-paas.labels" $ | nindent 8 }}
    name: external-metrics-reader
rules:
    -   apiGroups:
            -   "external.metrics.k8s.io"
        resources:
            -   "*"
        verbs:
            -   list
            -   get
            -   watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    labels:
        {{- include "observability-paas.labels" $ | nindent 8 }}
    name: custom-metrics:system:auth-delegator
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: system:auth-delegator
subjects:
    -   kind: ServiceAccount
        name: {{ $name }}
        namespace: {{ include "observability-paas.namespace" $ | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    labels:
        {{- include "observability-paas.labels" $ | nindent 8 }}
    name: custom-metrics-resource-reader
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: custom-metrics-resource-reader
subjects:
    -   kind: ServiceAccount
        name: {{ $name }}
        namespace: {{ include "observability-paas.namespace" $ | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    labels:
        {{- include "observability-paas.labels" $ | nindent 8 }}
    name: external-metrics-reader
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: external-metrics-reader
subjects:
    -   kind: ServiceAccount
        name: horizontal-pod-autoscaler
        namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        {{- include "observability-paas.labels" $ | nindent 8 }}
    name: custom-metrics-auth-reader
    namespace: kube-system
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: extension-apiserver-authentication-reader
subjects:
    -   kind: ServiceAccount
        name: {{ $name }}
        namespace: {{ include "observability-paas.namespace" $ | quote }}
{{- end }}