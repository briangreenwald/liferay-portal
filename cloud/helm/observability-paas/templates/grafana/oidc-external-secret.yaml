{{- if .Values.sso.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    labels:
        {{- include "observability-paas.labels" . | nindent 8 }}
    name: {{ .Values.sso.externalSecret.name | quote }}
    namespace: {{ include "observability-paas.namespace" . | quote }}
spec:
    dataFrom:
        -   extract:
                conversionStrategy: Default
                decodingStrategy: None
                key: {{ required "sso.externalSecret.remoteSecretName is required when sso.enabled is true" .Values.sso.externalSecret.remoteSecretName | quote }}
                metadataPolicy: None
                nullBytePolicy: Ignore
    refreshInterval: 1h0m0s
    secretStoreRef:
        kind: ClusterSecretStore
        name: {{ default "gcpsm-customer-css" .Values.sso.externalSecret.secretStoreName | quote }}
{{- end }}