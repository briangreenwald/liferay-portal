{{- $dxpOperatorRoleBinding := .Values.dxpOperatorRoleBinding -}}
{{- if $dxpOperatorRoleBinding.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        {{- include "liferay.labels" . | nindent 8 }}
    name: dxp-operator-role-binding
    namespace: {{ include "liferay.namespace" . }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: {{ $dxpOperatorRoleBinding.clusterRoleName }}
subjects:
    -   kind: ServiceAccount
        name: {{ $dxpOperatorRoleBinding.operatorServiceAccount.name }}
        namespace: {{ $dxpOperatorRoleBinding.operatorServiceAccount.namespace }}
{{- end -}}