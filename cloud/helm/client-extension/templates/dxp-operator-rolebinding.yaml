{{- if .Values.dxpOperatorRoleBinding.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        {{- include "liferay-client-extension.labels" . | nindent 8 }}
    name: {{ include "liferay-client-extension.fullname" . }}-dxp-operator
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: {{ .Values.dxpOperatorRoleBinding.clusterRoleName }}
subjects:
    -   kind: ServiceAccount
        name: {{ .Values.operatorServiceAccount.name }}
        namespace: {{ .Values.operatorServiceAccount.namespace }}
{{- end }}